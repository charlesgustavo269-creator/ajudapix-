<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gustavo Pix</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background: #121212; 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
        }
        .card { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 12px; 
            display: inline-block; 
            max-width: 400px; 
            width: 100%; 
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-top: 30px;
        }
        h2 { margin-top: 0; color: #32BCAD; }
        .info-banco {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 14px;
            line-height: 1.5;
        }
        .info-banco span {
            color: #aaa;
        }
        .qr-container {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 15px;
        }
        .qr-container img {
            width: 180px;
            height: 180px;
            display: block;
        }
        input[type="text"] { 
            width: 100%; 
            padding: 10px; 
            text-align: center; 
            background: #2a2a2a; 
            color: #fff; 
            border: 1px solid #444; 
            border-radius: 6px; 
            box-sizing: border-box;
            font-size: 13px;
        }
        button { 
            background: #32BCAD; 
            color: #000; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 15px; 
            width: 100%; 
            transition: background 0.2s;
        }
        button:hover { background: #289a8e; }
        .aviso { 
            color: #4CAF50; 
            font-size: 14px; 
            margin-top: 10px; 
            display: none; 
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Área Pix</h2>
        <p>Apoie o canal e o projeto!</p>

        <!-- Informações do Recebedor -->
        <div class="info-banco">
            <div><span>Nome:</span> <strong>Gustavo Charles dos Anjos Barreto</strong></div>
            <div><span>Banco:</span> <strong>PicPay</strong></div>
        </div>

        <!-- Carrega a imagem local qrcode.jpg -->
        <div class="qr-container">
            <img src="./qrcode.jpg" alt="QR Code Pix Oficial">
        </div>
        <p style="font-size: 12px; color: #aaa; margin-top: 0;">Aponte a câmera do celular para pagar</p>

        <!-- Campo da Chave Pix -->
        <input type="text" id="chavePix" readonly>
        
        <button onclick="copiarChave()">Copiar Chave Pix</button>
        <div id="msgSucesso" class="aviso">Chave copiada com sucesso!</div>
    </div>

    <script>
        const chavePixValor = "b5dfa434-497e-4c20-990f-9145664d0b8e";
        document.getElementById("chavePix").value = chavePixValor;

        function copiarChave() {
            var copyText = document.getElementById("chavePix");
            copyText.select();
            copyText.setSelectionRange(0, 99999); 
            navigator.clipboard.writeText(copyText.value);
            
            var msg = document.getElementById("msgSucesso");
            msg.style.display = "block";
            setTimeout(function() {
                msg.style.display = "none";
            }, 3000);
        }
    </script>

</body>
</html>
